<!DOCTYPE html>
<html lang="fr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BIO-CHRONOS | L'Horloge de l'Extinction</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Polices Google (Space Grotesk pour les titres Tech, Outfit pour le corps) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Configuration Tailwind Étendue -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                        mono: ['Space Grotesk', 'monospace'],
                    },
                    colors: {
                        bio: {
                            dark: '#020617', // Slate 950
                            panel: '#0f172a', // Slate 900
                            primary: '#2dd4bf', // Teal 400
                            secondary: '#0ea5e9', // Sky 500
                            danger: '#f43f5e', // Rose 500
                            warning: '#eab308', // Yellow 500
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                        'blob': 'blob 10s infinite',
                        'progress': 'progress 30s linear infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        },
                        blob: {
                            '0%': { transform: 'translate(0px, 0px) scale(1)' },
                            '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                            '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                            '100%': { transform: 'translate(0px, 0px) scale(1)' },
                        },
                        progress: {
                            '0%': { width: '0%' },
                            '100%': { width: '100%' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        /* CSS Custom pour le rendu "Élite" */
        body {
            background-color: #020617;
            color: #e2e8f0;
            overflow-x: hidden;
        }

        /* Arrière-plan animé */
        .bg-mesh {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, #0f172a 0%, #020617 100%);
            overflow: hidden;
        }
        
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            animation: blob 15s infinite alternate;
        }
        .orb-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #2dd4bf; animation-delay: 0s; }
        .orb-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #3b82f6; animation-delay: 2s; }
        .orb-3 { top: 40%; left: 40%; width: 30vw; height: 30vw; background: #6366f1; animation-delay: 4s; opacity: 0.2; }

        /* Effet de verre (Glassmorphism) */
        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(30, 41, 59, 0.6);
            border-color: rgba(45, 212, 191, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px -10px rgba(45, 212, 191, 0.15);
        }

        /* Scrollbar custom */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        /* Texte Glow */
        .text-glow { text-shadow: 0 0 20px rgba(45, 212, 191, 0.5); }
        .text-glow-red { text-shadow: 0 0 20px rgba(244, 63, 94, 0.5); }

        /* Animations d'entrée */
        .slide-in-up { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; transform: translateY(20px); }
        .delay-100 { animation-delay: 100ms; }
        .delay-200 { animation-delay: 200ms; }
        .delay-300 { animation-delay: 300ms; }
        
        @keyframes slideUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* Barre de progression 30s */
        .timer-bar {
            height: 2px;
            background: linear-gradient(90deg, #2dd4bf, #0ea5e9);
            width: 0%;
            transition: width 100ms linear; /* Sera contrôlé par JS pour précision */
        }
    </style>
</head>
<body class="antialiased selection:bg-bio-primary selection:text-bio-dark">

    <!-- Background Orbs -->

    <!-- Interface Grid Structure -->

                                </svg>

                        <!-- Titre Espèce -->
                        <h2 id="species-name" class="text-4xl md:text-6xl font-bold text-white leading-tight mb-2 font-mono tracking-tight text-glow transition-opacity duration-300">
                            Chargement...
                        </h2>
                        
                        <!-- Actions Rapides (Mobile/Desktop) -->
                        <div class="flex flex-wrap gap-3 mt-6 relative z-10">
                            <button onclick="app.tts()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-medium border border-white/5 transition-all">
                                <span>🔊</span> Écouter
                            </button>
                            <button onclick="app.share()" class="flex items-center gap-2 px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-sm font-medium border border-white/5 transition-all">

                            </button>

                    </article>

                    <!-- Navigation Temporelle (Carte Secondaire) -->
                    <div class="grid grid-cols-2 gap-4 slide-in-up delay-100">

                            <div class="text-left">
                                <div class="text-[10px] font-mono uppercase tracking-wider">Précédent</div>
                                <div class="text-sm font-bold">Heure -1</div>
                            </div>
                        </button>
                        <button id="btn-next" class="glass-card p-4 rounded-xl flex items-center justify-center gap-3 group text-slate-400 hover:text-white">
                            <div class="text-right">
                                <div class="text-[10px] font-mono uppercase tracking-wider">Suivant</div>
                                <div class="text-sm font-bold">Heure +1</div>
                            </div>
                            <svg class="w-5 h-5 transition-transform group-hover:translate-x-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" /></svg>
                        </button>
                    </div>
                </div>

                <!-- Colonne Droite: Détails (Bento Grid) -->
                <div class="lg:col-span-4 flex flex-col gap-4 slide-in-up delay-200">
                    
                    <!-- Stats Rapides -->
                    <div class="glass-card rounded-2xl p-5 border-l-4 border-bio-primary">

                    <!-- Habitat -->
                    <div class="glass-card rounded-2xl p-6 flex-grow">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="p-2 rounded bg-emerald-500/10 text-emerald-400">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064" /></svg>
                            </div>
                            <h3 class="font-bold text-lg">Habitat</h3>
                        </div>
                        <p id="species-habitat" class="text-slate-300 leading-relaxed text-sm">...</p>
                    </div>

                    <!-- Menaces -->
                    <div class="glass-card rounded-2xl p-6 flex-grow border border-rose-500/20 bg-rose-500/5">
                        <div class="flex items-center gap-3 mb-3">
                            <div class="p-2 rounded bg-rose-500/10 text-rose-400">
                                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>

            </div>
        </main>

        <!-- Dock Flottant (Navigation Principale) -->
        <div class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 w-[90%] md:w-auto">
            <nav class="glass-panel px-6 py-4 rounded-full flex items-center justify-between md:justify-center gap-4 md:gap-8 shadow-[0_10px_40px_-10px_rgba(0,0,0,0.8)] border border-white/10">
                
                <button onclick="app.resetToNow()" class="nav-btn group relative p-2 text-slate-400 hover:text-white transition-all hover:-translate-y-1">
                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>

                </button>
                
                <button onclick="app.togglePanel()" class="nav-btn group relative p-2 text-slate-400 hover:text-white transition-all hover:-translate-y-1">

                    <span class="absolute -top-10 left-1/2 -translate-x-1/2 bg-black text-white text-[10px] py-1 px-2 rounded opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap pointer-events-none">Index (20)</span>

                <!-- Bouton Central (Action) -->

                    <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z" /></svg>

                <button onclick="app.toggleStats()" class="nav-btn group relative p-2 text-slate-400 hover:text-white transition-all hover:-translate-y-1">

    <!-- Modals (Overlay) -->

        <div class="absolute inset-0 bg-bio-dark/90 backdrop-blur-lg" onclick="app.togglePanel()"></div>

                </div>

                    <div id="stat-favs" class="text-3xl font-bold text-warning font-mono">0</div>

                </div>
            </div>
            
            <button onclick="app.toggleStats()" class="mt-8 px-6 py-2 rounded-full bg-slate-700 hover:bg-slate-600 text-sm font-medium transition-colors">Fermer</button>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        // --- BASE DE DONNÉES (Identique mais structurée) ---
        const speciesDB = [
            { name: "Panda Géant", sci: "Ailuropoda melanoleuca", habitat: "Forêts de bambou (Chine)", threat: "Fragmentation habitat, faible reproduction" },
            { name: "Léopard des Neiges", sci: "Panthera uncia", habitat: "Himalaya & Asie Centrale", threat: "Braconnage, changement climatique" },
            { name: "Orang-outan de Bornéo", sci: "Pongo pygmaeus", habitat: "Forêts humides (Bornéo)", threat: "Huile de palme, incendies" },
            { name: "Vaquita", sci: "Phocoena sinus", habitat: "Golfe de Californie", threat: "Filets de pêche illégaux (Critique)" },
            { name: "Léopard de l'Amour", sci: "Panthera pardus orientalis", habitat: "Russie / Chine", threat: "Braconnage, consanguinité" },
            { name: "Rhinocéros de Java", sci: "Rhinoceros sondaicus", habitat: "Java (Indonésie)", threat: "Maladies, catastrophes naturelles" },
            { name: "Tigre", sci: "Panthera tigris", habitat: "Asie (Savanes, Forêts)", threat: "Trafic d'organes, conflit humain" },
            { name: "Baleine Bleue", sci: "Balaenoptera musculus", habitat: "Océans Mondiaux", threat: "Collisions navires, sonar" },
            { name: "Kakapo", sci: "Strigops habroptilus", habitat: "Nouvelle-Zélande", threat: "Prédateurs introduits" },
            { name: "Gorille des montagnes", sci: "Gorilla beringei beringei", habitat: "Virunga (Afrique)", threat: "Guerre, perte d'habitat" },
            { name: "Rhinocéros noir", sci: "Diceros bicornis", habitat: "Afrique de l'Est", threat: "Braconnage (corne)" },
            { name: "Tortue Luth", sci: "Dermochelys coriacea", habitat: "Océans Tropicaux", threat: "Plastique, vol d'oeufs" },
            { name: "Pangolin", sci: "Manis spp.", habitat: "Afrique / Asie", threat: "Trafic international (écailles)" },
            { name: "Ours polaire", sci: "Ursus maritimus", habitat: "Arctique", threat: "Fonte des glaces" },
            { name: "Axolotl", sci: "Ambystoma mexicanum", habitat: "Lac Xochimilco (Mexique)", threat: "Pollution, urbanisation" },
            { name: "Condor de Californie", sci: "Gymnogyps californianus", habitat: "Californie", threat: "Empoisonnement au plomb" },
            { name: "Bonobo", sci: "Pan paniscus", habitat: "RDC (Congo)", threat: "Viande de brousse" },
            { name: "Saola", sci: "Pseudoryx nghethensis", habitat: "Vietnam / Laos", threat: "Pièges (Licorne asiatique)" },
            { name: "Ara de Spix", sci: "Cyanopsitta spixii", habitat: "Brésil (Caatinga)", threat: "Disparu à l'état sauvage" },
            { name: "Thon rouge", sci: "Thunnus thynnus", habitat: "Atlantique", threat: "Surpêche gastronomique" }
        ];

        // --- MOTEUR DE L'APPLICATION (Pattern "App") ---
        const app = {
            state: {
                currentIndex: 0,
                favorites: JSON.parse(localStorage.getItem('bio_favs') || '[]'),
                views: 0,
                filter: 'all',
                lastUpdate: Date.now(),
                timerInterval: null
            },

            init() {
                this.calculateIndexFromTime();
                this.startClock();
                this.start30sCycle();
                this.render();
                this.setupListeners();
                this.updateStats();
            },

            // Logique Temporelle
            calculateIndexFromTime() {
                const now = new Date();
                const start = new Date(now.getFullYear(), 0, 0);
                const diff = (now - start) + ((start.getTimezoneOffset() - now.getTimezoneOffset()) * 60 * 1000);
                const oneHour = 1000 * 60 * 60;
                const hoursPassed = Math.floor(diff / oneHour);
                
                // Formule: Heure de l'année modulo nombre d'espèces
                this.state.currentIndex = hoursPassed % speciesDB.length;
            },

            // Cycle de 30 secondes (Demandé par le client)
            start30sCycle() {
                const bar = document.getElementById('cycle-progress');
                let startTime = Date.now();
                const duration = 30000; // 30s

                this.state.timerInterval = setInterval(() => {
                    const elapsed = Date.now() - startTime;
                    const progress = (elapsed / duration) * 100;

                    if (progress >= 100) {
                        // Reset à 30s
                        startTime = Date.now();
                        bar.style.width = '0%';
                        
                        // Effet de "Refresh" des données
                        this.triggerRefreshEffect();
                    } else {
                        bar.style.width = `${progress}%`;
                    }
                }, 50); // Fluidité 20fps pour la barre
            },

            triggerRefreshEffect() {
                // Simule une mise à jour des données ou un "heartbeat" du système
                const card = document.getElementById('main-card');
                card.classList.add('opacity-50', 'blur-sm');
                setTimeout(() => {
                    card.classList.remove('opacity-50', 'blur-sm');
                    // Optionnel : Actualiser l'heure exacte si changement d'heure
                    this.calculateIndexFromTime(); // Vérifie si on a changé d'heure réelle
                }, 300);
            },

            startClock() {
                setInterval(() => {
                    const now = new Date();
                    document.getElementById('live-clock').innerText = now.toLocaleTimeString();
                }, 1000);
            },

            // Rendu Principal
            render() {
                const species = speciesDB[this.state.currentIndex];
                if (!species) return;

                // Animation fade out
                const nameEl = document.getElementById('species-name');
                const habitatEl = document.getElementById('species-habitat');
                const threatEl = document.getElementById('species-threat');

                // Update DOM
                nameEl.innerHTML = `${species.name} <span class="block text-sm md:text-lg font-normal text-slate-400 font-sans mt-1 italic">${species.sci}</span>`;
                habitatEl.textContent = species.habitat;
                threatEl.textContent = species.threat;
                
                // Affichage Heure Virtuelle
                document.getElementById('current-hour-display').textContent = `#${(this.state.currentIndex + 1).toString().padStart(2, '0')}`;

                // Update Favorite Icon
                this.renderFavoriteBtn();
                
                // Increment Stats
                this.state.views++;
                this.updateStats();
            },

            renderFavoriteBtn() {
                const btn = document.getElementById('btn-favorite');
                const species = speciesDB[this.state.currentIndex];
                const isFav = this.state.favorites.includes(species.name);
                
                if (isFav) {
                    btn.classList.add('text-yellow-400', 'bg-yellow-400/10');
                    btn.classList.remove('text-slate-400');
                    btn.innerHTML = `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>`;
                } else {
                    btn.classList.remove('text-yellow-400', 'bg-yellow-400/10');
                    btn.classList.add('text-slate-400');
                    btn.innerHTML = `<svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.783-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg>`;
                }
            },

            // Navigation
            next() {
                this.state.currentIndex = (this.state.currentIndex + 1) % speciesDB.length;
                this.render();
            },
            prev() {
                this.state.currentIndex = (this.state.currentIndex - 1 + speciesDB.length) % speciesDB.length;
                this.render();
            },
            randomSpecies() {
                this.state.currentIndex = Math.floor(Math.random() * speciesDB.length);
                this.render();
            },
            resetToNow() {
                this.calculateIndexFromTime();
                this.render();
            },

            // Features
            toggleFavorite() {
                const species = speciesDB[this.state.currentIndex];
                const index = this.state.favorites.indexOf(species.name);
                
                if (index === -1) {
                    this.state.favorites.push(species.name);
                } else {
                    this.state.favorites.splice(index, 1);
                }
                
                localStorage.setItem('bio_favs', JSON.stringify(this.state.favorites));
                this.renderFavoriteBtn();
                this.updateList(); // Refresh list if open
                this.updateStats();
            },

            tts() {
                const s = speciesDB[this.state.currentIndex];
                const u = new SpeechSynthesisUtterance(`L'espèce actuelle est le ${s.name}. Son habitat est : ${s.habitat}. Menace principale : ${s.threat}`);
                u.lang = 'fr-FR';
                window.speechSynthesis.speak(u);
            },

            share() {
                if(navigator.share) {
                    const s = speciesDB[this.state.currentIndex];
                    navigator.share({
                        title: 'Bio-Chronos',
                        text: `Sauvez le ${s.name} ! #BioChronos`,
                        url: window.location.href
                    });
                } else {
                    alert('Lien copié dans le presse-papier !');
                }
            },
            
            learnMore() {
                const s = speciesDB[this.state.currentIndex];
                window.open(`https://www.google.com/search?q=${encodeURIComponent(s.name + ' conservation')}`, '_blank');
            },

            // UI Management
            togglePanel() {
                const modal = document.getElementById('modal-database');
                modal.classList.toggle('hidden');
                if (!modal.classList.contains('hidden')) {
                    this.updateList();
                    document.getElementById('search-input').focus();
                }
            },
            
            toggleStats() {
                document.getElementById('modal-stats').classList.toggle('hidden');
                document.getElementById('modal-stats').classList.toggle('flex');
            },

            updateList() {
                const list = document.getElementById('species-list');
                const search = document.getElementById('search-input').value.toLowerCase();
                list.innerHTML = '';

                const filtered = speciesDB.filter(s => {
                    if (this.state.filter === 'favorites' && !this.state.favorites.includes(s.name)) return false;
                    return s.name.toLowerCase().includes(search);
                });

                filtered.forEach((s, idx) => {
                    const isFav = this.state.favorites.includes(s.name);
                    const li = document.createElement('li');
                    li.className = "p-3 rounded-lg hover:bg-white/5 cursor-pointer flex justify-between items-center group transition-colors";
                    li.innerHTML = `
                        <span class="font-medium text-slate-300 group-hover:text-bio-primary">${s.name}</span>
                        ${isFav ? '<span class="text-yellow-400 text-xs">⭐</span>' : ''}
                    `;
                    li.onclick = () => {
                        // Retrouver l'index original
                        const originalIndex = speciesDB.findIndex(x => x.name === s.name);
                        this.state.currentIndex = originalIndex;
                        this.render();
                        this.togglePanel();
                    };
                    list.appendChild(li);
                });
            },

            setFilter(type) {
                this.state.filter = type;
                this.updateList();
            },

            updateStats() {
                document.getElementById('stat-views').innerText = this.state.views;
                document.getElementById('stat-favs').innerText = this.state.favorites.length;
            },

            setupListeners() {
                document.getElementById('btn-next').onclick = () => this.next();
                document.getElementById('btn-prev').onclick = () => this.prev();
                document.getElementById('btn-favorite').onclick = () => this.toggleFavorite();
                document.getElementById('search-input').oninput = () => this.updateList();
                
                // Keyboard
                document.addEventListener('keydown', (e) => {
                    if (e.key === 'ArrowRight') this.next();
                    if (e.key === 'ArrowLeft') this.prev();
                    if (e.key === 'Escape') {
                        document.getElementById('modal-database').classList.add('hidden');
                        document.getElementById('modal-stats').classList.add('hidden');
                    }
                });
            }
        };

        // Lancement
        document.addEventListener('DOMContentLoaded', () => app.init());

    </script>
</body>
</html>
